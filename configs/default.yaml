project:
  name: GENESIS AI
  stage: research_prototype
  seed: 42

model:
  in_channels: 3
  hidden_dim: 192
  depth: 4
  num_heads: 6
  max_tokens: 1024
  mlp_ratio: 4.0

diffusion:
  timesteps: 1000
  beta_start: 0.0001
  beta_end: 0.02
  prediction_type: epsilon

training:
  learning_rate: 0.0001
  weight_decay: 0.01
  batch_size: 1
  mixed_precision: true
  checkpoint_interval: 1000

# Begin with tiny clips (for example: 4 frames at 32x32).
# Direct pixel-space video transformers are memory-intensive.
data:
  frames: 4
  height: 32
  width: 32
  channels: 3
